<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MultiUs · 宇宙 #0042</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0a0a12; }
  body {
    font-family: "Courier New", ui-monospace, monospace;
    cursor: pointer;
    user-select: none;
  }

  #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .char {
    position: fixed;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    z-index: 2;
  }

  /* 像素气泡：白底黑字 4px 边框 + 小尾巴 */
  .bubble {
    position: fixed;
    z-index: 3;
    max-width: 280px;
    background: #fff;
    color: #111;
    border: 4px solid #111;
    box-shadow: 4px 4px 0 rgba(0,0,0,.45);
    padding: 10px 14px;
    font-size: 15px;
    font-weight: bold;
    line-height: 1.6;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity .18s steps(2);
    pointer-events: none;
  }
  .bubble.show { opacity: 1; }
  /* 阶梯状像素尾巴：两级黑块，从 4px 边框自然延伸 */
  .bubble::after, .bubble::before {
    content: "";
    position: absolute;
    left: 50%;
    background: #111;
  }
  .bubble::after { margin-left: -12px; bottom: -8px;  width: 24px; height: 8px; }
  .bubble::before { margin-left: -6px;  bottom: -16px; width: 12px; height: 8px; z-index: -1; }
  .bubble .caret {
    display: inline-block;
    width: .55em;
    background: #111;
    color: transparent;
    animation: blink .7s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  #titlebar {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 4;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px;
    font-size: 13px;
    letter-spacing: 2px;
    color: #8a8aa5;
    text-shadow: 2px 2px 0 #000;
  }
  #rec { color: #ff4d4d; animation: blink 1.1s steps(1) infinite; }
  #rec .label { color: #8a8aa5; margin-left: 6px; }

  #hint {
    position: fixed; bottom: 10px; left: 0; right: 0;
    z-index: 4;
    text-align: center;
    font-size: 11px;
    letter-spacing: 2px;
    color: #4c4c66;
    text-shadow: 2px 2px 0 #000;
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<canvas id="char-oscar" class="char"></canvas>
<canvas id="char-mira"  class="char"></canvas>

<div id="bubble-oscar" class="bubble left"></div>
<div id="bubble-mira"  class="bubble right"></div>

<div id="titlebar">
  <span>宇宙 #0042 · 深夜 · 他们还没在一起</span>
  <span><span id="rec">●</span><span class="label">旁观中</span></span>
</div>

<div id="hint">A = 自动播放 · 点击 = 下一句</div>

<script>
// ---------- 素材与帧布局（LPC universal 64px 帧） ----------
const ROW_WALK_W = 9, ROW_WALK_E = 11;      // 朝西/朝东行走行
const IDLE_SEQ = [0, 1, 0, 2];              // 站立帧->重心偏移->站立->反向，慢速播放像呼吸
const IDLE_MS = 640;

const CHARS = {
  oscar: { src: 'assets/chars/oscar.png', row: ROW_WALK_E, side: 'left'  },  // 左，朝右
  mira:  { src: 'assets/chars/mira.png',  row: ROW_WALK_W, side: 'right' },  // 右，朝左
};

// ---------- 对话 ----------
const LINES = [
  { who: 'oscar', text: '你说，其他宇宙里的我们，现在在干嘛？' },
  { who: 'mira',  text: '大概率在加班。我们哪种人生都躲不掉加班。' },
  { who: 'oscar', text: '就没一个宇宙……我们胆子大一点的那种？' },
  { who: 'mira',  text: '有啊。有一个宇宙里，你去年就把那句话说出来了。' },
  { who: 'oscar', text: '……哪句？' },
  { who: 'mira',  text: '你知道是哪句。' },
  { who: 'oscar', text: '那，后来呢。' },
  { who: 'mira',  text: '后来啊——那个宇宙的信号，到不了这儿。看不着的。' },
  { who: 'oscar', text: '行吧。那这个宇宙的我，就再攒攒。' },
  { who: 'mira',  text: '别攒太久。星星都要睡了。' },
];

// ---------- 背景：星空 + 城市剪影 + 地面 ----------
const bg = document.getElementById('bg');
const bctx = bg.getContext('2d');
let W = 0, H = 0, GROUND_Y = 0;
let stars = [], windows = [], buildings = [];

function buildSky() {
  stars = [];
  const n = Math.floor(W * H / 9000);
  for (let i = 0; i < n; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * GROUND_Y * 0.82,
      s: Math.random() < 0.12 ? 3 : (Math.random() < 0.4 ? 2 : 1),
      phase: Math.random() * Math.PI * 2,
      speed: 0.4 + Math.random() * 1.1,
    });
  }
  // 城市剪影：贴在地面线上的像素楼
  buildings = [];
  let x = -10;
  while (x < W + 10) {
    const bw = 28 + Math.floor(Math.random() * 60);
    const bh = 30 + Math.floor(Math.random() * GROUND_Y * 0.35);
    buildings.push({ x, w: bw, h: bh });
    x += bw + 4 + Math.floor(Math.random() * 18);
  }
  // 亮着的窗户
  windows = [];
  for (const b of buildings) {
    const cols = Math.floor(b.w / 12), rows = Math.floor(b.h / 16);
    for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
      if (Math.random() < 0.12) {
        windows.push({
          x: b.x + 4 + c * 12, y: GROUND_Y - b.h + 6 + r * 16,
          phase: Math.random() * Math.PI * 2,
        });
      }
    }
  }
}

function drawSky(t) {
  // 夜空渐变
  const g = bctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, '#07070f');
  g.addColorStop(0.6, '#12122a');
  g.addColorStop(1, '#241f3d');
  bctx.fillStyle = g;
  bctx.fillRect(0, 0, W, GROUND_Y);

  // 像素月亮
  const mx = W * 0.78, my = H * 0.14, ms = Math.max(3, Math.round(H / 220));
  bctx.fillStyle = '#e8e4c8';
  const moonRows = [2, 4, 6, 6, 6, 4, 2];
  moonRows.forEach((len, i) => {
    bctx.fillRect(mx - len * ms / 2, my + i * ms, len * ms, ms);
  });
  bctx.fillStyle = '#c9c4a4';
  bctx.fillRect(mx + ms, my + 2 * ms, ms, ms);
  bctx.fillRect(mx - ms, my + 4 * ms, ms, ms);

  // 星星（闪烁）
  for (const st of stars) {
    const tw = 0.35 + 0.65 * Math.abs(Math.sin(t / 1000 * st.speed + st.phase));
    bctx.globalAlpha = tw;
    bctx.fillStyle = st.s === 3 ? '#fff7d6' : '#cdd3ff';
    bctx.fillRect(Math.round(st.x), Math.round(st.y), st.s, st.s);
  }
  bctx.globalAlpha = 1;

  // 城市剪影
  bctx.fillStyle = '#0c0c18';
  for (const b of buildings) bctx.fillRect(b.x, GROUND_Y - b.h, b.w, b.h);
  // 窗户（部分缓慢明灭）
  for (const wn of windows) {
    const on = Math.sin(t / 2600 + wn.phase) > -0.6;
    bctx.fillStyle = on ? '#d8b95c' : '#2a2440';
    bctx.fillRect(wn.x, wn.y, 4, 6);
  }

  // 地面
  bctx.fillStyle = '#16121f';
  bctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  bctx.fillStyle = '#2c2440';
  bctx.fillRect(0, GROUND_Y, W, 4);
  // 地面像素杂点
  bctx.fillStyle = '#1e1830';
  for (let i = 0; i < W; i += 26) {
    bctx.fillRect(i + ((i * 7) % 13), GROUND_Y + 10 + ((i * 13) % Math.max(1, (H - GROUND_Y - 16))), 6, 3);
  }
}

// ---------- 角色 ----------
const sprites = {};
function loadSprite(key) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => { sprites[key] = img; resolve(); };
    img.src = CHARS[key].src;
  });
}

let SCALE = 4;
function layout() {
  W = window.innerWidth; H = window.innerHeight;
  bg.width = W; bg.height = H;
  GROUND_Y = Math.round(H * 0.86);
  buildSky();

  // 角色可见身高约占屏高 1/4（64px 帧里角色约 46px）
  SCALE = Math.max(3, Math.round(H * 0.25 / 46));
  const size = 64 * SCALE;
  const cy = GROUND_Y - size + 4 * SCALE;  // 脚踩地面（帧底部有留白，微调）

  const oscar = document.getElementById('char-oscar');
  const mira = document.getElementById('char-mira');
  for (const [key, el, cx] of [['oscar', oscar, W * 0.34], ['mira', mira, W * 0.66]]) {
    el.width = size; el.height = size;
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.left = Math.round(cx - size / 2) + 'px';
    el.style.top = Math.round(cy) + 'px';
    const ctx = el.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    CHARS[key].ctx = ctx;
    CHARS[key].cx = cx;
    CHARS[key].top = cy;
    CHARS[key].size = size;
  }
  positionBubbles();
}

function drawChar(key, frame) {
  const c = CHARS[key];
  const img = sprites[key];
  if (!img || !c.ctx) return;
  c.ctx.clearRect(0, 0, c.size, c.size);
  c.ctx.drawImage(img, frame * 64, c.row * 64, 64, 64, 0, 0, c.size, c.size);
}

let idleFrame = 0;
setInterval(() => {
  idleFrame = (idleFrame + 1) % IDLE_SEQ.length;
  drawChar('oscar', IDLE_SEQ[idleFrame]);
  drawChar('mira', IDLE_SEQ[idleFrame]);
}, IDLE_MS);

// ---------- 气泡与对话机 ----------
const bubbles = { oscar: document.getElementById('bubble-oscar'), mira: document.getElementById('bubble-mira') };

function positionBubbles() {
  for (const key of ['oscar', 'mira']) {
    const c = CHARS[key], b = bubbles[key];
    if (!c.ctx) continue;
    const bw = b.offsetWidth;
    const left = Math.max(8, Math.min(W - bw - 8, Math.round(c.cx - bw / 2)));
    b.style.left = left + 'px';                              // 气泡水平居中于角色
    b.style.top = Math.round(c.top - b.offsetHeight - 24) + 'px';
  }
}

let lineIdx = 0, typing = false, typeTimer = null, autopilot = true, advanceTimer = null;

function showLine(i) {
  const { who, text } = LINES[i];
  const me = bubbles[who], other = bubbles[who === 'oscar' ? 'mira' : 'oscar'];
  other.classList.remove('show');
  me.classList.add('show');
  positionBubbles();

  typing = true;
  let n = 0;
  me.innerHTML = '<span class="caret">|</span>';
  clearInterval(typeTimer);
  typeTimer = setInterval(() => {
    n++;
    me.innerHTML = text.slice(0, n) + (n < text.length ? '<span class="caret">|</span>' : '');
    positionBubbles();  // 气泡长高后重新对齐
    if (n >= text.length) {
      clearInterval(typeTimer);
      typing = false;
      scheduleNext(text.length);
    }
  }, 65);
}

function scheduleNext(len) {
  if (!autopilot) return;
  clearTimeout(advanceTimer);
  const readMs = 900 + len * 60;                    // 读完这句话的时间
  const thinkMs = 600 + Math.random() * 600;        // 0.6-1.2s 的「在想」
  advanceTimer = setTimeout(nextLine, readMs + thinkMs);
}

function nextLine() {
  clearInterval(typeTimer);
  typing = false;
  lineIdx = (lineIdx + 1) % LINES.length;
  showLine(lineIdx);
}

document.body.addEventListener('click', () => {
  if (typing) {  // 先补完当前句
    clearInterval(typeTimer);
    typing = false;
    const { who, text } = LINES[lineIdx];
    bubbles[who].textContent = text;
    positionBubbles();
    scheduleNext(text.length);
  } else {
    nextLine();
  }
});

window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'a') {
    autopilot = !autopilot;
    clearTimeout(advanceTimer);
    if (autopilot && !typing) scheduleNext(LINES[lineIdx].text.length);
  }
});

// ---------- 启动 ----------
window.addEventListener('resize', layout);
Promise.all([loadSprite('oscar'), loadSprite('mira')]).then(() => {
  layout();
  drawChar('oscar', 0);
  drawChar('mira', 0);
  showLine(0);
});
layout();

(function loop(t) {
  drawSky(t || 0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
